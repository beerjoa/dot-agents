# Public subset of ~/.codex/config.toml. Machine, account, project, provider,
# authorization, and integration settings are intentionally omitted.
personality = "pragmatic"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
show_raw_agent_reasoning = true

[notice]
hide_rate_limit_model_nudge = true

[features]
multi_agent = true
collaboration_modes = true
plugin_hooks = true
hooks = true
js_repl = false
fast_mode = true
memories = true

[agents]
max_threads = 24

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = false
