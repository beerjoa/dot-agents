# Merge these keys into ~/.config/herdr/config.toml.
[keys]
prefix = "ctrl+space"
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
copy_mode = "prefix+["
new_workspace = ["prefix+shift+c", "cmd+n"]
new_tab = ["prefix+c", "cmd+t"]
rename_tab = ["prefix+r", "prefix+shift+t"]
close_tab = ["prefix+k", "prefix+shift+x", "cmd+shift+w"]
switch_tab = ["prefix+1..9", "cmd+alt+1..9"]
previous_tab = ["prefix+p", "alt+left", "cmd+shift+["]
next_tab = ["prefix+n", "alt+right", "cmd+shift+]"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"
switch_workspace = "cmd+1..9"
next_workspace = ["prefix+shift+n", "alt+down", "ctrl+tab"]
previous_workspace = ["prefix+shift+p", "alt+up", "ctrl+shift+tab"]
rename_workspace = ["prefix+shift+r", "prefix+shift+w"]
close_workspace = ["prefix+shift+k", "prefix+shift+d"]
focus_pane_left = ["ctrl+alt+left", "cmd+left", "cmd+alt+left"]
focus_pane_down = ["ctrl+alt+down", "cmd+down", "cmd+alt+down"]
focus_pane_up = ["ctrl+alt+up", "cmd+up", "cmd+alt+up"]
focus_pane_right = ["ctrl+alt+right", "cmd+right", "cmd+alt+right"]
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"
rename_pane = "prefix+shift+o"
split_vertical = ["prefix+v", "alt+shift+enter", "cmd+d"]
split_horizontal = ["prefix+h", "alt+enter", "cmd+shift+d"]
close_pane = ["prefix+x", "alt+esc", "cmd+w", "cmd+q"]
zoom = ["prefix+z", "cmd+f", "cmd+alt+f", "cmd+shift+enter"]
last_pane = "prefix+;"

[experimental]
switch_ascii_input_source_in_prefix = true
