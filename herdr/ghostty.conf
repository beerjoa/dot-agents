# Enter and leave Herdr mode manually if the shell wrapper is unavailable.
keybind = cmd+shift+h=activate_key_table:herdr
keybind = herdr/
keybind = herdr/cmd+shift+h=deactivate_key_table

# Herdr's Ctrl+Space prefix.
keybind = herdr/performable:ctrl+space=csi:32;5u

# Omarchy Super+Arrow focus bindings, using macOS Command.
keybind = herdr/performable:cmd+left=csi:1;9D
keybind = herdr/performable:cmd+down=csi:1;9B
keybind = herdr/performable:cmd+up=csi:1;9A
keybind = herdr/performable:cmd+right=csi:1;9C
keybind = herdr/performable:cmd+alt+left=csi:1;11D
keybind = herdr/performable:cmd+alt+down=csi:1;11B
keybind = herdr/performable:cmd+alt+up=csi:1;11A
keybind = herdr/performable:cmd+alt+right=csi:1;11C
keybind = herdr/performable:ctrl+alt+left=csi:1;7D
keybind = herdr/performable:ctrl+alt+down=csi:1;7B
keybind = herdr/performable:ctrl+alt+up=csi:1;7A
keybind = herdr/performable:ctrl+alt+right=csi:1;7C
keybind = herdr/performable:ctrl+left=csi:1;5D
keybind = herdr/performable:ctrl+down=csi:1;5B
keybind = herdr/performable:ctrl+up=csi:1;5A
keybind = herdr/performable:ctrl+right=csi:1;5C
keybind = herdr/performable:ctrl+alt+shift+left=csi:1;8D
keybind = herdr/performable:ctrl+alt+shift+down=csi:1;8B
keybind = herdr/performable:ctrl+alt+shift+up=csi:1;8A
keybind = herdr/performable:ctrl+alt+shift+right=csi:1;8C
keybind = herdr/performable:alt+enter=csi:13;3u
keybind = herdr/performable:alt+shift+enter=csi:13;4u
keybind = herdr/performable:alt+escape=csi:27;3u
keybind = herdr/performable:alt+left=csi:1;3D
keybind = herdr/performable:alt+right=csi:1;3C
keybind = herdr/performable:alt+up=csi:1;3A
keybind = herdr/performable:alt+down=csi:1;3B
keybind = herdr/performable:alt+shift+left=csi:1;4D
keybind = herdr/performable:alt+shift+right=csi:1;4C

# Herdr workspace and tab actions.
keybind = herdr/performable:cmd+n=csi:110;9u
keybind = herdr/performable:cmd+t=csi:116;9u
keybind = herdr/performable:cmd+shift+[=csi:91;10u
keybind = herdr/performable:cmd+shift+]=csi:93;10u
keybind = herdr/performable:cmd+shift+w=csi:119;10u
keybind = herdr/performable:ctrl+tab=csi:9;5u
keybind = herdr/performable:ctrl+shift+tab=csi:9;6u
keybind = herdr/performable:cmd+1=csi:49;9u
keybind = herdr/performable:cmd+2=csi:50;9u
keybind = herdr/performable:cmd+3=csi:51;9u
keybind = herdr/performable:cmd+4=csi:52;9u
keybind = herdr/performable:cmd+5=csi:53;9u
keybind = herdr/performable:cmd+6=csi:54;9u
keybind = herdr/performable:cmd+7=csi:55;9u
keybind = herdr/performable:cmd+8=csi:56;9u
keybind = herdr/performable:cmd+9=csi:57;9u
keybind = herdr/performable:cmd+alt+1=csi:49;11u
keybind = herdr/performable:cmd+alt+2=csi:50;11u
keybind = herdr/performable:cmd+alt+3=csi:51;11u
keybind = herdr/performable:cmd+alt+4=csi:52;11u
keybind = herdr/performable:cmd+alt+5=csi:53;11u
keybind = herdr/performable:cmd+alt+6=csi:54;11u
keybind = herdr/performable:cmd+alt+7=csi:55;11u
keybind = herdr/performable:cmd+alt+8=csi:56;11u
keybind = herdr/performable:cmd+alt+9=csi:57;11u

# Pane layout actions. Ghostty keeps its own defaults outside this table.
keybind = herdr/performable:cmd+d=csi:100;9u
keybind = herdr/performable:cmd+shift+d=csi:100;10u
keybind = herdr/performable:cmd+w=csi:119;9u
keybind = herdr/performable:cmd+q=csi:113;9u
keybind = herdr/performable:cmd+f=csi:102;9u
keybind = herdr/performable:cmd+alt+f=csi:102;11u
keybind = herdr/performable:cmd+shift+enter=csi:13;10u
